<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>M1887 • Minimal Dark Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#1c1d20;   /* page background - dark gray */
    --bg-2:#26272a;   /* card background */
    --card-border:#2f3134;
    --muted:#9aa0a6;
    --text:#e6e9eb;
    --accent: rgba(255,255,255,0.03);
    --glass: rgba(255,255,255,0.02);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(180deg, var(--bg-1), #17181a);
    font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    padding:28px;
  }

  /* layout */
  .wrap{
    width:100%;
    max-width:980px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
  }
  @media(max-width:820px){ .wrap{grid-template-columns:1fr} }

  .card{
    background: linear-gradient(180deg, var(--bg-2), #232426);
    border-radius:12px;
    padding:12px;
    border:1px solid var(--card-border);
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    transition: transform .28s cubic-bezier(.2,.9,.3,1), box-shadow .28s ease;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .card:hover{ transform: translateY(-6px); box-shadow: 0 26px 60px rgba(0,0,0,0.7); }

  .imgwrap{
    border-radius:10px;
    overflow:hidden;
    background: linear-gradient(90deg, rgba(255,255,255,0.01), rgba(255,255,255,0.015));
    cursor: zoom-in;
    display:block;
    border:1px solid var(--accent);
  }
  .imgwrap img{
    display:block;
    width:100%;
    height:auto;
    transition: transform .45s cubic-bezier(.2,.9,.3,1);
    transform-origin:center center;
    will-change:transform;
  }
  .card:hover .imgwrap img{ transform: scale(1.03); }

  .caption{
    color:var(--muted);
    font-size:14px;
    text-align:center;
    padding:6px 8px;
    border-radius:8px;
    background: linear-gradient(180deg, rgba(255,255,255,0.01), transparent);
    border:1px solid rgba(255,255,255,0.01);
  }

  /* modal / viewer */
  .modal{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background: rgba(8,9,10,0.78);
    z-index:9999;
    padding:20px;
  }
  .modal.show{ display:flex; }
  .viewer{
    max-width:1200px;
    width:100%;
    height:auto;
    background: linear-gradient(180deg, #0f1113, #151617);
    border-radius:12px;
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:10px;
    align-items:center;
    border:1px solid rgba(255,255,255,0.03);
    box-shadow: 0 40px 120px rgba(0,0,0,0.7);
  }
  .viewer img{
    max-width:100%;
    max-height:80vh;
    border-radius:8px;
    cursor:grab;
    transition: transform .12s linear;
    user-select:none;
  }
  .viewer .meta{ color:var(--muted); font-size:14px; text-align:center; }
  .controls{ display:flex; gap:8px; margin-top:6px; }

  .btn{
    background: rgba(255,255,255,0.03);
    color:var(--text);
    padding:8px 10px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,0.02);
    cursor:pointer;
    font-weight:600;
  }
  .btn:active{ transform: translateY(1px) }

  /* small header */
  .hdr{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .logo{width:44px;height:44px;border-radius:8px;background:linear-gradient(135deg,#2f9aa8,#7b5cc8);display:flex;align-items:center;justify-content:center;font-weight:700;color:#0d1012}
  h1{font-size:16px;margin:0}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
</style>
</head>
<body>
  <div style="width:100%;max-width:1100px">
    <div class="hdr">
      <div class="logo">M1887</div>
      <div>
        <h1>M1887 • Dark Gallery</h1>
        <div class="sub">Tampilan minimal — dua gambar + caption. Klik gambar untuk perbesar.</div>
      </div>
    </div>

    <div class="wrap">
      <div class="card">
        <a class="imgwrap" data-src="image1.jpg" title="Klik untuk perbesar">
          <img src="image1.jpg" alt="Gambar 1">
        </a>
        <div class="caption">sg config gausah drama liat atribut nya🥷</div>
      </div>

      <div class="card">
        <a class="imgwrap" data-src="image2.jpg" title="Klik untuk perbesar">
          <img src="image2.jpg" alt="Gambar 2">
        </a>
        <div class="caption">citer lek🪨</div>
      </div>
    </div>
  </div>

  <!-- Modal viewer -->
  <div id="modal" class="modal" aria-hidden="true">
    <div class="viewer" role="dialog" aria-modal="true">
      <img id="viewImg" src="" alt="viewer">
      <div id="viewCaption" class="meta"></div>
      <div class="controls">
        <button id="zoomOut" class="btn">−</button>
        <button id="reset" class="btn">Reset</button>
        <button id="zoomIn" class="btn">+</button>
        <button id="close" class="btn">Tutup</button>
      </div>
    </div>
  </div>

<script>
(function(){
  const links = document.querySelectorAll('.imgwrap');
  const modal = document.getElementById('modal');
  const viewImg = document.getElementById('viewImg');
  const viewCaption = document.getElementById('viewCaption');
  const zoomIn = document.getElementById('zoomIn');
  const zoomOut = document.getElementById('zoomOut');
  const resetBtn = document.getElementById('reset');
  const closeBtn = document.getElementById('close');

  const captions = {
    'image1.jpg': 'sg config gausah drama liat atribut nya🥷',
    'image2.jpg': 'citer lek🪨'
  };

  links.forEach(link=>{
    link.addEventListener('click', (e)=>{
      e.preventDefault();
      const src = link.getAttribute('data-src') || link.querySelector('img').src;
      openModal(src);
    });
  });

  function openModal(src){
    viewImg.src = src;
    const name = src.split('/').pop();
    viewCaption.textContent = captions[name] || '';
    modal.classList.add('show');
    modal.setAttribute('aria-hidden','false');
    scale = 1; tx=0; ty=0; update();
  }

  function closeModal(){
    modal.classList.remove('show');
    modal.setAttribute('aria-hidden','true');
    viewImg.src = '';
  }

  closeBtn.addEventListener('click', closeModal);
  modal.addEventListener('click', (e)=>{ if(e.target === modal) closeModal(); });

  // zoom & drag
  let scale = 1, tx = 0, ty = 0;
  function update(){ viewImg.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`; }

  zoomIn.addEventListener('click', ()=>{ scale = Math.min(scale + 0.25, 8); update(); });
  zoomOut.addEventListener('click', ()=>{ scale = Math.max(scale - 0.25, 0.25); update(); });
  resetBtn.addEventListener('click', ()=>{ scale = 1; tx=0; ty=0; update(); });

  // drag handling
  let dragging=false, startX=0, startY=0;
  viewImg.addEventListener('pointerdown', (e)=>{
    dragging=true; viewImg.setPointerCapture(e.pointerId);
    startX = e.clientX - tx; startY = e.clientY - ty;
    viewImg.style.cursor = 'grabbing';
  });
  window.addEventListener('pointermove', (e)=>{ if(!dragging) return; tx = e.clientX - startX; ty = e.clientY - startY; update(); });
  window.addEventListener('pointerup', ()=>{ dragging=false; viewImg.style.cursor='grab'; });

  // wheel to zoom
  document.querySelector('.viewer').addEventListener('wheel',(e)=>{
    e.preventDefault();
    scale = Math.min(Math.max(scale - (e.deltaY * 0.0012), 0.25), 8);
    update();
  }, {passive:false});

})();
</script>
</body>
</html>
