<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>M1887 Gallery</title>
<style>
  :root{
    --bg:#0f1113;
    --panel:#151618;
    --muted:#9aa0a6;
    --accent:#f2c94c;
    --glow: rgba(255,255,255,0.08);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    background: linear-gradient(180deg,#0b0b0c 0%, #0f1113 100%);
    color:#e6e6e6;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px;
  }

  /* Page wrapper */
  .wrap{
    width:100%;
    max-width:1100px;
    border-radius:14px;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    box-shadow: 0 10px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
    padding:26px;
    overflow:hidden;
    transform-origin:center;
    animation: pageIn .9s ease both;
  }

  @keyframes pageIn {
    from { opacity:0; transform: translateY(18px) scale(.995); }
    to { opacity:1; transform: translateY(0) scale(1); }
  }

  header{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:18px;
  }

  .logo{
    width:56px;height:56px;border-radius:10px;
    background: linear-gradient(135deg,#26282b,#111314);
    box-shadow: 0 6px 18px rgba(0,0,0,0.6), 0 0 28px rgba(0,0,0,0.25) inset;
    display:flex;align-items:center;justify-content:center;
    color:var(--accent); font-weight:700; font-size:18px;
    position:relative;
    animation: logoFloat 6s ease-in-out infinite;
  }
  @keyframes logoFloat {
    0%{ transform: translateY(0) rotate(0deg) }
    50%{ transform: translateY(-6px) rotate(2deg) }
    100%{ transform: translateY(0) rotate(0deg) }
  }

  .title{
    font-size:20px; font-weight:700; letter-spacing:0.2px;
    color:#fff;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
  }
  .subtitle{ font-size:13px;color:var(--muted); margin-top:4px }

  /* gallery layout */
  .grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:29px;
    align-items:start;
  }

  .card{
    background: linear-gradient(180deg, rgba(255,255,255,0.012), rgba(255,255,255,0.01));
    border-radius:12px;
    padding:12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.02);
    position:relative;
    overflow:hidden;
    transition: transform .45s cubic-bezier(.2,.9,.2,1), box-shadow .45s;
  }
  .card:hover{ transform: translateY(-6px); box-shadow: 0 18px 40px rgba(0,0,0,0.65) }

  .imgwrap{
    width:100%; aspect-ratio:16/9;
    background:linear-gradient(180deg,#0b0b0c,#0f1113);
    border-radius:10px;
    overflow:hidden;
    position:relative;
    display:flex;align-items:center;justify-content:center;
  }
  .imgwrap img{
    width:100%; height:100%; object-fit:cover; display:block;
    transition: transform .8s cubic-bezier(.2,.9,.2,1);
  }
  .card:hover .imgwrap img{ transform: scale(1.04) }

  /* neon border */
  .neon{
    position:absolute; inset:8px; pointer-events:none; border-radius:8px;
    box-shadow: 0 0 30px rgba(255,255,255,0.02) inset;
  }

  .meta{
    margin-top:12px; display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .caption{
    font-weight:600; font-size:15px; color:#fff;
    text-shadow: 0 6px 28px rgba(0,0,0,0.55);
  }
  .caption .glow{
    color:#fff;
    text-shadow: 0 0 10px rgba(255,255,255,0.06), 0 0 24px rgba(0,0,0,0.6);
  }
  .small{ color:var(--muted); font-size:12px }

  /* fancy caption glow for requested text */
  .tag-sg{ color:#ffd166; text-shadow: 0 0 18px rgba(255,193,7,0.14), 0 2px 16px rgba(0,0,0,0.5); }
  .tag-citer{ color:#9ad1ff; text-shadow: 0 0 16px rgba(154,209,255,0.08), 0 2px 14px rgba(0,0,0,0.45); }

  /* responsive */
  @media(max-width:780px){
    .grid{ grid-template-columns: 1fr; }
  }

  /* footer small */
  .footer{ margin-top:16px; text-align:center; color:var(--muted); font-size:13px }
</style>
</head>
<body>
  <div class="wrap" role="main">
    <header>
      <div class="logo">⚡</div>
      <div>
        <div class="title">M1887 </div>
        <div class="subtitle"> MENDING SUREN LAWAN MU BUKAN ORANG BIASA ATI ATI AJA AIM NYA </div>
      </div>
    </header>

    <section class="grid">
      <!-- CARD 1 (image1 = merah) -->
      <article class="card">
        <div class="imgwrap">
          <!-- Replace the src below with embedded base64 if you want single-file.
               For now it uses a filename: image1.jpg (upload this to same folder) -->
          <img src="image1.jpg" alt="M1887 - MODE MURNI">
          <div class="neon" aria-hidden="true"></div>
        </div>
        <div class="meta">
          <div class="caption tag-sg">sg config — gausah drama, liat atributnya SILIT</div>
          <div class="small">opm rasa terompet</div>
        </div>
      </article>

      <!-- CARD 2 (image2 = hijau) -->
      <article class="card">
        <div class="imgwrap">
          <img src="image2.jpg" alt="M1887 - MODE CITT">
          <div class="neon" aria-hidden="true"></div>
        </div>
        <div class="meta">
          <div class="caption tag-citer">MODE NGECITTTTT</div>
          <div class="small">GATAU APA BINGUNH</div>
        </div>
      </article>
    </section>

    <div class="footer">Dev Marchya • yang keras lek soalnya yang lembek bikin ketagihan </div>
  </div>

  <!-- Optional: small script to enable keyboard nav / lightbox later -->
  <script>
    // small enhancement: click image to open in new tab (full)
    document.querySelectorAll('.imgwrap img').forEach(img=>{
      img.style.cursor='zoom-in';
      img.addEventListener('click', ()=> window.open(img.src,'_blank'));
    });
  </script>
</body>
</html>
